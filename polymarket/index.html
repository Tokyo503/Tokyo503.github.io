<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وكيل المراجحة</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1b;--mute:#6b6b66;--acc:#2b59c3}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--fg:#ececea;--mute:#9a9a94;--acc:#7aa2ff}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,sans-serif}
#msg{padding:16px;color:var(--mute)} #msg a{color:var(--acc)}
iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
</style>
</head>
<body>
<div id="msg">جارٍ تحميل اللوحة…</div>
<script>
// Public dashboard of Tokyo503/polymarket-agent (virtual money only).
// The agent writes index.html and state/*.html to its public agent-state branch every ~30 minutes;
// this page reads them live, so nothing here needs rebuilding. Content is shown in a sandboxed
// iframe with scripts disabled.
(function () {
  var RAW = "https://raw.githubusercontent.com/Tokyo503/polymarket-agent/agent-state/";
  var p = new URLSearchParams(location.search).get("p");
  var path = p && /^[a-z0-9_-]{1,32}$/.test(p) ? "state/" + p + ".html" : "index.html";
  var msg = document.getElementById("msg");
  fetch(RAW + path + "?t=" + Math.floor(Date.now() / 300000), {cache: "no-store"})
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      var doc = new DOMParser().parseFromString(html, "text/html");
      doc.querySelectorAll("script").forEach(function (s) { s.remove(); });
      doc.querySelectorAll("a[href]").forEach(function (a) {
        var m = a.getAttribute("href").match(/^state\/([a-z0-9_-]{1,32})\.html$/);
        if (m) { a.setAttribute("href", location.pathname + "?p=" + m[1]); a.setAttribute("target", "_top"); }
        else { a.setAttribute("target", "_blank"); a.setAttribute("rel", "noopener"); }
      });
      if (p) {
        var back = doc.createElement("p");
        back.innerHTML = '<a target="_top" href="' + location.pathname + '">← الرجوع للوحة</a>';
        doc.body.insertBefore(back, doc.body.firstChild);
      }
      var f = document.createElement("iframe");
      f.setAttribute("sandbox", "allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation");
      f.setAttribute("title", "لوحة الوكيل");
      f.srcdoc = "<!doctype html>" + doc.documentElement.outerHTML;
      msg.remove();
      document.body.appendChild(f);
    })
    .catch(function (e) {
      msg.innerHTML = 'تعذّر تحميل اللوحة (' + String(e.message).replace(/[<>&]/g, "") + '). جرّب بعد دقائق، أو افتح ' +
        '<a href="https://github.com/Tokyo503/polymarket-agent/tree/agent-state">فرع agent-state</a>.';
    });
  setTimeout(function () { location.reload(); }, 300000);
})();
</script>
</body>
</html>
